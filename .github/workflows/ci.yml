name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY_AVAILABLE: ${{ secrets.NVD_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify backend
        working-directory: backend
        run: mvn clean verify

      - name: Generate backend SBOM
        working-directory: backend
        run: mvn org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom -DoutputFormat=xml

      - name: Audit backend SBOM
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.3.8 scan source -L /src/backend/target/bom.xml

      - name: Cache backend SCA database
        if: env.NVD_API_KEY_AVAILABLE == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Audit backend dependencies
        if: env.NVD_API_KEY_AVAILABLE == 'true'
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn org.owasp:dependency-check-maven:check

      - name: Report skipped backend Dependency-Check
        if: env.NVD_API_KEY_AVAILABLE != 'true'
        run: |
          echo "::notice title=Dependency-Check skipped::Configure the NVD_API_KEY repository secret to enable the OWASP Dependency-Check Maven gate. The backend SBOM remains audited by OSV in this workflow."

  container-images:
    name: Container Images
    runs-on: ubuntu-latest
    steps:
      - name: Audit PostgreSQL image
        id: trivy-postgres
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: postgres:16-alpine
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          version: v0.74.0

      - name: Report PostgreSQL image findings
        if: steps.trivy-postgres.outcome == 'failure'
        run: |
          echo "::warning title=PostgreSQL image vulnerabilities::Trivy found HIGH or CRITICAL vulnerabilities in postgres:16-alpine. The audit is non-blocking until the base image can be updated or exceptions are documented."

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test frontend E2E
        working-directory: frontend
        run: npm run test:e2e
